<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Géminis</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-maskable-192.png">
<script>
// Abierta como aplicación instalada: va directo al sistema, en la misma ventana.
var SISTEMA = "https://script.google.com/macros/s/AKfycbzBlephutDAbGlkvLlNCHr2_6Gf5RehsZDL_EE6LBGO_tGrhQIKOniBlQ4SYk92UOz5KQ/exec/recepcion";
if (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone) location.replace(SISTEMA);
</script>
<style>
html,body{margin:0;min-height:100%;background:#f4f2fb;color:#2a2a35;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(380px,100%);background:#fff;border-radius:18px;padding:32px 24px;text-align:center;box-shadow:0 10px 40px rgba(53,0,114,.08)}
.card img{width:96px;height:96px;border-radius:50%}
h1{font-size:26px;margin:14px 0 4px}
p{margin:6px 0;color:#666}
.btn{display:block;width:100%;box-sizing:border-box;margin-top:16px;padding:14px;border-radius:12px;border:0;font:600 16px system-ui,sans-serif;text-decoration:none;cursor:pointer}
.pri{background:#3b0a7a;color:#fff}
.sec{background:#efeaf9;color:#3b0a7a}
#ayuda{font-size:14px}
</style>
</head>
<body>
<main>
<div class="card">
<img src="icono-192.png" alt="Géminis">
<h1>Géminis</h1>
<p>Agenda, clientes y caja</p>
<button type="button" class="btn pri" id="instalar" hidden>Instalar la aplicación</button>
<p id="ayuda">Para instalarla: menú ⋮ de Chrome → <b>Agregar a la pantalla principal</b> → <b>Instalar</b>.</p>
<a class="btn sec" id="abrir" href="#">Abrir el sistema</a>
</div>
</main>
<script>
document.getElementById("abrir").href = SISTEMA;
var aviso = null, b = document.getElementById("instalar");
addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); aviso = e; b.hidden = false; });
b.addEventListener("click", function () { if (!aviso) return; aviso.prompt(); aviso.userChoice.finally(function () { aviso = null; b.hidden = true; }); });
addEventListener("appinstalled", function () { b.hidden = true; document.getElementById("ayuda").textContent = "Listo: abrila desde el ícono de Géminis en tu pantalla de inicio."; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
